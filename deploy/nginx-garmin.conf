# Opcjonalne: wystawienie dashboardu na domenie.
# Domyslny wariant z DEPLOY.md to tunel SSH i wtedy ten plik nie jest potrzebny.
#
# Streamlit chodzi po WebSockecie, wiec proxy MUSI przepuszczac Upgrade -
# bez tego strona sie laduje, ale zostaje na wiecznym "Connecting...".
#
# Dane w tym dashboardzie to historia zdrowia i slady GPS z okolic domu,
# wiec basic auth nie jest ozdoba. Zaloz plik z haslem:
#   sudo htpasswd -c /etc/nginx/.htpasswd twoj_login
# TLS przez certbot:
#   sudo certbot --nginx -d garmin.twojadomena.pl

server {
    listen 80;
    server_name garmin.twojadomena.pl;
    # certbot sam dopisze tu przekierowanie na HTTPS
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name garmin.twojadomena.pl;

    # ssl_certificate / ssl_certificate_key wypelni certbot
    ssl_certificate     /etc/letsencrypt/live/garmin.twojadomena.pl/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/garmin.twojadomena.pl/privkey.pem;

    auth_basic           "Garmin Dashboard";
    auth_basic_user_file /etc/nginx/.htpasswd;

    # Wykresy Plotly i world.json potrafia wazyc po kilkaset kB.
    client_max_body_size 32m;

    location / {
        proxy_pass http://127.0.0.1:8501;
        proxy_http_version 1.1;

        # Bez tych dwoch linii Streamlit nie zestawi sesji.
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Dlugo zyjace poloczenie WebSocket nie moze byc ucinane po 60s.
        proxy_read_timeout  86400;
        proxy_send_timeout  86400;
        proxy_buffering     off;
    }
}
