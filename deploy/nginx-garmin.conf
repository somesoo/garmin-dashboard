# Dashboard na wlasnej domenie przez nginx + certbot (DEPLOY.md, sekcja 6).
# Prostsza alternatywa z automatycznym HTTPS: deploy/Caddyfile.
#
# deploy/install.sh podmienia DOMENA na Twoja subdomene i wrzuca plik do
# /etc/nginx/sites-available/garmin. Recznie:
#   sed 's/DOMENA/garmin.twojadomena.pl/g' deploy/nginx-garmin.conf | sudo tee /etc/nginx/sites-available/garmin
#   sudo ln -s /etc/nginx/sites-available/garmin /etc/nginx/sites-enabled/
#   sudo certbot --nginx -d garmin.twojadomena.pl     # certyfikat + przekierowanie 80 -> 443
#
# Bez basic auth: kto patrzy, rozstrzyga logowanie Google w aplikacji (auth.py),
# a telefony maja wlasne klucze do /api (api.py). Basic auth blokowalby pushe
# z iPhone'a i PWA. Streamlit i API sluchaja tylko na 127.0.0.1 - ten serwer
# jest jedyna droga do srodka.

server {
    listen 80;
    listen [::]:80;
    server_name DOMENA;

    # Do pierwszego certyfikatu strona idzie po HTTP; certbot --nginx dopisze
    # tu przekierowanie na HTTPS i blok 443 z certyfikatem.

    # Pelny eksport Apple Health (wgrywany na stronie Konto) to setki MB.
    client_max_body_size 2g;

    # Nie zdradzaj wersji nginx.
    server_tokens off;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options    "nosniff" always;
    add_header Referrer-Policy           "same-origin" always;

    # API: pushe z iPhone'a, baza i podsumowanie dla PWA, sama PWA pod /api/app/.
    location /api/ {
        proxy_pass http://127.0.0.1:8502;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 64m;          # = api.MAX_BODY
        proxy_read_timeout 120s;
    }

    location / {
        proxy_pass http://127.0.0.1:8501;
        proxy_http_version 1.1;

        # Streamlit chodzi po WebSockecie: bez tych dwoch linii strona sie laduje,
        # ale zostaje na wiecznym "Connecting...".
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Host i schemat sa potrzebne logowaniu Google (adres powrotu /oauth2callback),
        # a naglowki przekierowania mowia auth.py, ze gosc nie siedzi przy serwerze.
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Dlugo zyjace polaczenie WebSocket nie moze byc ucinane po 60 s,
        # a wgrywanie duzego eksportu nie moze byc buforowane na dysk nginx.
        proxy_read_timeout      86400;
        proxy_send_timeout      86400;
        proxy_buffering         off;
        proxy_request_buffering off;
    }
}
