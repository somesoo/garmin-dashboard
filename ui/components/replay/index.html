<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Odtwarzacz</title>
<style>
  :root { --ink: #fafafa; --ink2: #d5d7dc; --muted: #9aa0aa; --faint: #6b707a; --line: #1f2126; --edge: #24272d;
          --card: #0d0e10; --hover: #15171b; --accent: #3987e5; }
  html, body { margin: 0; padding: 0; background: transparent; color: var(--ink); overflow: hidden;
               font: 14px/1.4 "Source Sans 3", "Source Sans Pro", -apple-system, system-ui, "Segoe UI", sans-serif;
               -webkit-tap-highlight-color: transparent; }
  #app { display: flex; flex-direction: column; gap: 10px; }
  #mapwrap { position: relative; border-radius: 12px; overflow: hidden; background: #000; border: 1px solid var(--edge); }
  #map { display: block; width: 100%; }
  #chips { position: absolute; left: 8px; top: 8px; display: flex; gap: 4px; flex-wrap: wrap; max-width: calc(100% - 16px); }
  #zoom { position: absolute; right: 8px; top: 8px; display: flex; flex-direction: column; gap: 4px; }
  #zoom button { width: 34px; height: 34px; padding: 0; border-radius: 10px; font-size: 18px; line-height: 1; }
  #zoom button:disabled { opacity: .35; cursor: default; }
  #map.pan { cursor: grab; } #map.pan:active { cursor: grabbing; }
  #legend { position: absolute; left: 8px; bottom: 8px; display: flex; align-items: center; gap: 6px;
            background: rgba(0,0,0,.62); border-radius: 8px; padding: 4px 8px; font-size: 11px; color: var(--ink2);
            font-variant-numeric: tabular-nums; }
  #legend .sw { display: flex; } #legend .sw i { display: block; width: 14px; height: 8px; }
  #attr { position: absolute; right: 6px; bottom: 4px; font-size: 10px; color: #9aa0aa; background: rgba(0,0,0,.5);
          padding: 0 4px; border-radius: 4px; }
  #attr a { color: inherit; }
  button { font: inherit; color: var(--ink2); background: rgba(13,14,16,.86); border: 1px solid var(--edge);
           border-radius: 999px; padding: 3px 11px; cursor: pointer; line-height: 1.3; }
  button[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }
  button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  @media (hover: hover) { button:hover:not([aria-pressed="true"]) { background: var(--hover); color: var(--ink); } }
  #stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
  @media (max-width: 520px) { #stats { grid-template-columns: repeat(3, 1fr); } }
  .cell { background: var(--card); border: 1px solid var(--edge); border-radius: 10px; padding: 7px 10px 8px; min-width: 0; }
  .cell .k { font-size: 10.5px; font-weight: 600; letter-spacing: .07em; text-transform: uppercase; color: var(--faint);
             white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .cell .v { font-size: 20px; font-weight: 650; color: var(--ink); font-variant-numeric: tabular-nums; white-space: nowrap; }
  .cell .v small { font-size: 12px; font-weight: 500; color: var(--muted); margin-left: 3px; }
  #scrub { width: 100%; margin: 0; accent-color: var(--accent); cursor: pointer; }
  #ctrl { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
  #play { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 650; min-width: 96px;
          padding: 5px 14px; }
  #clock { margin-left: auto; font-variant-numeric: tabular-nums; color: var(--muted); font-size: 13px; }
  #note { font-size: 11.5px; color: var(--faint); }
  @media (max-width: 520px) { .cell .v { font-size: 17px; } #play { min-width: 80px; } }
</style>
</head>
<body>
<div id="app">
  <div id="mapwrap">
    <canvas id="map"></canvas>
    <div id="chips" role="group"></div>
    <div id="zoom" role="group">
      <button id="zin" type="button">+</button>
      <button id="zout" type="button">−</button>
      <button id="zfollow" type="button" aria-pressed="true">⌖</button>
    </div>
    <div id="legend"></div>
    <div id="attr">© <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">OpenStreetMap</a> contributors</div>
  </div>
  <div id="stats"></div>
  <input id="scrub" type="range" min="0" max="1000" step="1" value="0" />
  <div id="ctrl"><button id="play" type="button"></button><span id="speeds" role="group"></span><span id="clock"></span></div>
  <div id="note"></div>
</div>
<script>
"use strict";
/* The Streamlit component protocol by hand, as in ../globe/ and ../herochart/. */
function send(type, data) { window.parent.postMessage({ isStreamlitMessage: true, type, ...data }, "*"); }
const $ = (id) => document.getElementById(id);

// OpenStreetMap standard tiles, as the globe's flat map (CARTO's rasters want a key now).
// The canvas filter turns them dark, so the trail stays the loudest thing on the map.
const TILE_URL = "https://tile.openstreetmap.org/{z}/{x}/{y}.png";
const TILE_FILTER = {
  light: "saturate(0.35) brightness(1.04) contrast(0.92)",
  dark: "invert(1) hue-rotate(180deg) saturate(0.3) brightness(0.82) contrast(0.9)",
};
const FILTER_OK = "filter" in CanvasRenderingContext2D.prototype;
const PACE_WINDOW = 30;       // seconds the pace figure looks back
const TILE_CACHE = 400;

let A = null;                 // the last render's args
let D = null;                 // the track, prepared
const S = { pos: 0, playing: false, speed: 10, measure: "pace", last: 0, raf: 0, zoomStep: 0, follow: true };
const V = { w: 0, h: 0, dpr: 1, zoom: 0, cx: 0, cy: 0 };   // map view
const tiles = new Map();
const base = document.createElement("canvas");
let ctx, bctx;
// The charts in the other column (../replaycharts/) share this clock: we publish it, they send seeks.
let channel = null, channelName = null;

/* ------------------------------------------------------------ helpers */

const clamp = (x, a, b) => Math.max(a, Math.min(b, x));
const pad2 = (n) => String(n).padStart(2, "0");
function fmtTime(s) {
  s = Math.max(0, Math.round(s));
  const h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60);
  return h ? `${h}:${pad2(m)}:${pad2(s % 60)}` : `${m}:${pad2(s % 60)}`;
}
function fmtPace(min) {            // 5.72 is 5:43, never "5.72"
  if (!(min > 0) || min > 60) return "—";
  const s = Math.round(min * 60);
  return `${Math.floor(s / 60)}:${pad2(s % 60)}`;
}
// Index i with t[i] <= x < t[i+1] (the last index at the end).
function find(x) {
  const t = D.t;
  let lo = 0, hi = t.length - 1;
  while (lo < hi - 1) { const mid = (lo + hi) >> 1; if (t[mid] <= x) lo = mid; else hi = mid; }
  return lo;
}
function lerpAt(arr, x, i) {
  const j = Math.min(i + 1, D.t.length - 1);
  const span = D.t[j] - D.t[i];
  const f = span > 0 ? clamp((x - D.t[i]) / span, 0, 1) : 0;
  return arr[i] + (arr[j] - arr[i]) * f;
}
function quantile(values, q) {
  const v = values.filter((x) => Number.isFinite(x)).sort((a, b) => a - b);
  if (!v.length) return 0;
  return v[Math.min(v.length - 1, Math.max(0, Math.round(q * (v.length - 1))))];
}

/* ------------------------------------------------------------ prepare */

function prepare() {
  const d = A.data;
  D = { t: d.t, km: d.km, lat: d.lat, lon: d.lon, hr: d.hr, ele: d.ele, pace: d.pace, cad: d.cad };
  D.T = d.t[d.t.length - 1];
  // Spherical Mercator, world = 1.
  D.ux = d.lon.map((lon) => (lon + 180) / 360);
  D.uy = d.lat.map((lat) => {
    const r = (lat * Math.PI) / 180;
    return (1 - Math.log(Math.tan(r) + 1 / Math.cos(r)) / Math.PI) / 2;
  });
  // Climb so far: positive changes of a smoothed profile, so GPS jitter does not count as hills.
  if (D.ele) {
    const sm = D.ele.map((_, i) => {
      let s = 0, n = 0;
      for (let k = Math.max(0, i - 2); k <= Math.min(D.ele.length - 1, i + 2); k++) { s += D.ele[k]; n++; }
      return s / n;
    });
    D.gain = [0];
    for (let i = 1; i < sm.length; i++) D.gain.push(D.gain[i - 1] + Math.max(0, sm[i] - sm[i - 1]));
  }
  // The measures the track can colour by; pace runs backwards (fast = the light end on dark).
  D.measures = [];
  if (D.pace) D.measures.push({ key: "pace", label: A.text.m_pace, series: D.pace, reverse: true });
  if (D.hr) D.measures.push({ key: "hr", label: A.text.m_hr, series: D.hr, reverse: false });
  if (D.ele) D.measures.push({ key: "ele", label: A.text.m_ele, series: D.ele, reverse: false });
  if (!D.measures.some((m) => m.key === S.measure)) S.measure = D.measures.length ? D.measures[0].key : null;
  for (const m of D.measures) {
    m.lo = quantile(m.series, 0.05);
    m.hi = quantile(m.series, 0.95);
    if (!(m.hi > m.lo)) { m.lo = Math.min(...m.series); m.hi = Math.max(...m.series); }
    // Smoothed copy for the strip underneath.
    const w = Math.max(1, Math.round(m.series.length / 60));
    m.smooth = m.series.map((_, i) => {
      let s = 0, n = 0;
      for (let k = Math.max(0, i - w); k <= Math.min(m.series.length - 1, i + w); k++) { s += m.series[k]; n++; }
      return s / n;
    });
  }
  buildStaticUi();
}

function measure() { return D.measures.find((m) => m.key === S.measure) || null; }
function binOf(m, value) {
  const steps = A.theme.ramp.length;
  const share = (value - m.lo) / (m.hi - m.lo || 1);
  let idx = clamp(Math.floor(share * steps), 0, steps - 1);
  const ramp = m.reverse ? steps - 1 - idx : idx;      // pace: low value = fast = the light end
  return A.theme.ramp[ramp];
}
function formatValue(m, v) {
  if (m.key === "pace") return fmtPace(v);
  return Math.round(v).toString();
}

/* ------------------------------------------------------------ static UI */

function buildStaticUi() {
  const T = A.text;
  // Colour chips (inside the film: changing the colour must not restart a Streamlit run).
  const chips = $("chips");
  chips.innerHTML = "";
  chips.setAttribute("aria-label", T.colour);
  if (D.measures.length > 1) {
    for (const m of D.measures) {
      const b = document.createElement("button");
      b.type = "button"; b.textContent = m.label; b.dataset.key = m.key;
      b.onclick = () => { S.measure = m.key; syncChips(); drawBase(); paint(); };
      chips.appendChild(b);
    }
  }
  // Speeds.
  const sp = $("speeds");
  sp.innerHTML = "";
  sp.setAttribute("aria-label", T.speed);
  for (const x of A.speeds) {
    const b = document.createElement("button");
    b.type = "button"; b.textContent = `×${x}`; b.dataset.speed = x;
    b.title = `${x} ${T.speed_hint}`;
    b.onclick = () => { S.speed = x; syncChips(); };
    sp.appendChild(b);
  }
  if (!A.speeds.includes(S.speed)) S.speed = A.speeds[0];
  // Numbers beside the map: the cells that exist for this track.
  const cells = [["distance", "dist"], ["time", "time"], ["pace", "pace"]];
  if (D.hr) cells.push(["hr", "hr"]);
  if (D.ele) cells.push(["elevation", "ele"], ["climb", "gain"]);
  if (D.cad) cells.push(["cadence", "cad"]);
  const st = $("stats");
  st.innerHTML = "";
  for (const [label, id] of cells) {
    const c = document.createElement("div");
    c.className = "cell";
    c.innerHTML = `<div class="k"></div><div class="v" id="v_${id}"></div>`;
    c.firstChild.textContent = T[label];
    st.appendChild(c);
  }
  $("note").textContent = `×${S.speed} = ${S.speed} ${T.speed_hint}`;
  $("scrub").setAttribute("aria-label", T.seek);
  $("zin").setAttribute("aria-label", T.zoom_in); $("zin").title = T.zoom_in;
  $("zout").setAttribute("aria-label", T.zoom_out); $("zout").title = T.zoom_out;
  $("zfollow").setAttribute("aria-label", T.follow); $("zfollow").title = T.follow;
  syncChips();
  syncZoomUi();
}

function syncChips() {
  for (const b of $("chips").children) b.setAttribute("aria-pressed", String(b.dataset.key === S.measure));
  for (const b of $("speeds").children) b.setAttribute("aria-pressed", String(Number(b.dataset.speed) === S.speed));
  $("note").textContent = `×${S.speed} = ${S.speed} ${A.text.speed_hint}`;
  const m = measure();
  const lg = $("legend");
  if (!m) { lg.style.display = "none"; return; }
  lg.style.display = "flex";
  // The ramp always reads dark -> light; pace is the one that flips what the ends mean
  // (the light end is fast), so its labels run slow -> fast.
  const left = m.reverse ? m.hi : m.lo, right = m.reverse ? m.lo : m.hi;
  lg.innerHTML = `<span>${formatValue(m, left)}</span><span class="sw">${A.theme.ramp.map((c) => `<i style="background:${c}"></i>`).join("")}</span><span>${formatValue(m, right)}</span>`;
}

function setPlayLabel() {
  const T = A.text;
  const end = S.pos >= D.T;
  const text = S.playing ? `❚❚ ${T.pause}` : end ? `↺ ${T.again}` : `▶ ${T.play}`;
  // Only when it changes: rewriting the button's text sixty times a second is churn under a pressed button.
  const button = $("play");
  if (button.textContent !== text) button.textContent = text;
  button.setAttribute("aria-label", S.playing ? T.pause : T.play);
}

/* ------------------------------------------------------------ map */

function layout() {
  const wrap = $("mapwrap");
  const w = Math.max(220, Math.floor(wrap.clientWidth || document.body.clientWidth));
  const h = Math.max(220, A.map_height | 0);
  V.w = w; V.h = h; V.dpr = window.devicePixelRatio || 1;
  for (const c of [$("map"), base]) { c.width = Math.round(w * V.dpr); c.height = Math.round(h * V.dpr); }
  $("map").style.height = `${h}px`;
  ctx = $("map").getContext("2d");
  bctx = base.getContext("2d");
  // Fit the route in the box with a margin, centred.
  const pad = 36;
  const minx = Math.min(...D.ux), maxx = Math.max(...D.ux), miny = Math.min(...D.uy), maxy = Math.max(...D.uy);
  const sx = Math.max(maxx - minx, 1e-7), sy = Math.max(maxy - miny, 1e-7);
  const fitPx = Math.min((w - 2 * pad) / sx, (h - 2 * pad) / sy);
  V.fit = clamp(Math.log2(fitPx / 256), 1, 18);
  V.home = [(minx + maxx) / 2, (miny + maxy) / 2];
  applyZoom(true);
}

/* The camera. Zoom 0 shows the whole route; each step in is twice as close. Zoomed in, the camera
   follows the runner (the default: a finger must keep scrolling the page, so there is no touch pan)
   or stays where a mouse drag left it. */
const MAX_STEPS = 5;
function applyZoom(jump) {
  V.zoom = clamp(V.fit + S.zoomStep, 1, 19);
  if (S.zoomStep === 0) { [V.cx, V.cy] = V.home; return; }
  if (S.follow || jump) followHead(true);
}
function headAt() {
  const i = find(S.pos);
  return [lerpAt(D.ux, S.pos, i), lerpAt(D.uy, S.pos, i)];
}
// Move the camera toward the runner; true when it moved (the base has to be redrawn).
function followHead(snap) {
  if (S.zoomStep === 0 || !S.follow) return false;
  const [hx, hy] = headAt();
  const k = snap ? 1 : 0.2;
  const nx = V.cx + (hx - V.cx) * k, ny = V.cy + (hy - V.cy) * k;
  const moved = Math.abs(nx - V.cx) * worldPx() > 0.3 || Math.abs(ny - V.cy) * worldPx() > 0.3;
  if (moved || snap) { V.cx = nx; V.cy = ny; }
  return moved || snap;
}
function setZoomStep(step) {
  S.zoomStep = clamp(step, 0, MAX_STEPS);
  applyZoom(true);
  syncZoomUi();
  drawBase(); paint();
}
function syncZoomUi() {
  $("zin").disabled = S.zoomStep >= MAX_STEPS;
  $("zout").disabled = S.zoomStep <= 0;
  $("zfollow").setAttribute("aria-pressed", String(S.follow));
  $("zfollow").style.display = S.zoomStep > 0 ? "" : "none";
}
const worldPx = () => 256 * 2 ** V.zoom;
const sxOf = (ux) => V.w / 2 + (ux - V.cx) * worldPx();
const syOf = (uy) => V.h / 2 + (uy - V.cy) * worldPx();

function requestTile(z, x, y) {
  const key = `${z}/${x}/${y}`;
  let e = tiles.get(key);
  if (e) return e;
  const img = new Image();
  img.crossOrigin = "anonymous";
  e = { img, ok: false, cv: null };
  img.onload = () => {
    // The theme filter is paid once per tile, not once per frame: a camera that follows the runner
    // redraws the base every frame, and a filter on a dozen tiles each time is what a phone cannot do.
    const cv = document.createElement("canvas");
    cv.width = img.naturalWidth || 256; cv.height = img.naturalHeight || 256;
    const c = cv.getContext("2d");
    if (FILTER_OK) c.filter = TILE_FILTER[A && A.theme.dark ? "dark" : "light"];
    c.drawImage(img, 0, 0);
    e.cv = cv; e.ok = true; schedule();
  };
  img.src = TILE_URL.replace("{z}", z).replace("{x}", x).replace("{y}", y);
  tiles.set(key, e);
  while (tiles.size > TILE_CACHE) tiles.delete(tiles.keys().next().value);
  return e;
}

let pendingBase = 0;
function schedule() {            // tiles arrive one by one: repaint the base once per frame at most
  if (pendingBase) return;
  pendingBase = requestAnimationFrame(() => { pendingBase = 0; drawBase(); paint(); });
}

function drawBase() {
  const { w, h, dpr } = V;
  bctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  bctx.clearRect(0, 0, w, h);
  bctx.fillStyle = A.theme.surface;
  bctx.fillRect(0, 0, w, h);
  // Tiles: one level finer on a retina screen (OSM tiles are 256 px only).
  const zt = clamp(Math.round(V.zoom) + (dpr > 1 ? 1 : 0), 0, 19);
  const n = 2 ** zt, size = worldPx() / n;
  const x0 = Math.floor((V.cx - w / 2 / worldPx()) * n), x1 = Math.floor((V.cx + w / 2 / worldPx()) * n);
  const y0 = Math.max(0, Math.floor((V.cy - h / 2 / worldPx()) * n)), y1 = Math.min(n - 1, Math.floor((V.cy + h / 2 / worldPx()) * n));
  for (let ty = y0; ty <= y1; ty++) {
    for (let tx = x0; tx <= x1; tx++) {
      const wx = ((tx % n) + n) % n;
      const px = sxOf(tx / n), py = syOf(ty / n);
      const e = requestTile(zt, wx, ty);
      if (e.ok) { bctx.drawImage(e.cv, px, py, size + 0.5, size + 0.5); continue; }
      for (let dz = 1; dz <= Math.min(6, zt); dz++) {      // stand in with a coarser tile while it loads
        const p = tiles.get(`${zt - dz}/${wx >> dz}/${ty >> dz}`);
        if (!p || !p.ok) continue;
        const part = p.cv.width / 2 ** dz;
        bctx.drawImage(p.cv, (wx - ((wx >> dz) << dz)) * part, (ty - ((ty >> dz) << dz)) * part, part, part, px, py, size + 0.5, size + 0.5);
        break;
      }
    }
  }
  if (!FILTER_OK && A.theme.dark) { bctx.fillStyle = "rgba(0,0,0,.6)"; bctx.fillRect(0, 0, w, h); }
  // The whole route, quiet: where the dot is going.
  bctx.lineCap = "round"; bctx.lineJoin = "round";
  bctx.strokeStyle = A.theme.dark ? "rgba(255,255,255,.2)" : "rgba(0,0,0,.2)";
  bctx.lineWidth = 7;
  bctx.beginPath();
  D.ux.forEach((u, i) => { const x = sxOf(u), y = syOf(D.uy[i]); i ? bctx.lineTo(x, y) : bctx.moveTo(x, y); });
  bctx.stroke();
}

function drawTrail() {
  const { dpr } = V;
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.drawImage(base, 0, 0);
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.lineCap = "round"; ctx.lineJoin = "round"; ctx.lineWidth = 4.5;
  const m = measure();
  const i = find(S.pos);
  const hx = lerpAt(D.ux, S.pos, i), hy = lerpAt(D.uy, S.pos, i);
  const colourOf = (k) => (m ? binOf(m, (m.series[k] + m.series[Math.min(k + 1, m.series.length - 1)]) / 2) : A.theme.series);
  for (let k = 0; k < i; k++) {
    ctx.strokeStyle = colourOf(k);
    ctx.beginPath();
    ctx.moveTo(sxOf(D.ux[k]), syOf(D.uy[k]));
    ctx.lineTo(sxOf(D.ux[k + 1]), syOf(D.uy[k + 1]));
    ctx.stroke();
  }
  ctx.strokeStyle = colourOf(i);
  ctx.beginPath();
  ctx.moveTo(sxOf(D.ux[i]), syOf(D.uy[i]));
  ctx.lineTo(sxOf(hx), syOf(hy));
  ctx.stroke();
  // Start (a ring) and the runner.
  ctx.fillStyle = A.theme.ink; ctx.strokeStyle = A.theme.surface; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.arc(sxOf(D.ux[0]), syOf(D.uy[0]), 4.5, 0, 7); ctx.fill(); ctx.stroke();
  ctx.fillStyle = "#fff"; ctx.strokeStyle = A.theme.accent; ctx.lineWidth = 3.5;
  ctx.beginPath(); ctx.arc(sxOf(hx), syOf(hy), 7, 0, 7); ctx.fill(); ctx.stroke();
}

/* ------------------------------------------------------------ numbers + strip */

function updateStats() {
  const i = find(S.pos);
  const set = (id, text, unit) => {
    const el = $(`v_${id}`);
    if (!el) return;
    el.textContent = text;
    if (unit) { const s = document.createElement("small"); s.textContent = unit; el.appendChild(s); }
  };
  const km = lerpAt(D.km, S.pos, i);
  set("dist", km.toFixed(2), "km");
  set("time", fmtTime(S.pos));
  // Pace of the last half minute: a stop at the lights reads "—", not a pace of 40 min/km.
  const back = Math.max(0, S.pos - PACE_WINDOW);
  const dk = km - lerpAt(D.km, back, find(back)), dt = S.pos - back;
  set("pace", dt >= 5 && dk * 1000 > dt * 0.4 ? fmtPace(dt / 60 / dk) : "—", "/km");
  if (D.hr) set("hr", String(Math.round(lerpAt(D.hr, S.pos, i))), "bpm");
  if (D.ele) {
    set("ele", String(Math.round(lerpAt(D.ele, S.pos, i))), "m");
    set("gain", `+${Math.round(lerpAt(D.gain, S.pos, i))}`, "m");
  }
  if (D.cad) set("cad", String(Math.round(lerpAt(D.cad, S.pos, i))), "spm");
  $("clock").textContent = `${fmtTime(S.pos)} / ${fmtTime(D.T)}`;
}

// What the charts beside the map need to know: where we are and whether the film runs.
function publish() {
  if (channel) channel.postMessage({ type: "pos", pos: S.pos, playing: S.playing, T: D.T, speed: S.speed });
}

function paint() {
  if (!D || !ctx) return;
  // The state buttons come first and a failing drawing must not take the controls with it.
  setPlayLabel();
  try {
    if (followHead(!S.playing)) drawBase();        // the camera runs after the dot: the map moves under it
    drawTrail();
    updateStats();
  } catch (error) {
    console.error("replay paint failed:", error);
  }
  const scrub = $("scrub");
  if (document.activeElement !== scrub || S.playing) scrub.value = String(Math.round((S.pos / D.T) * 1000));
  publish();
}

/* ------------------------------------------------------------ playback */

function frame(now) {
  S.raf = 0;
  if (S.playing) {
    S.pos += (Math.max(0, now - S.last) / 1000) * S.speed;
    S.last = now;
    if (S.pos >= D.T) { S.pos = D.T; S.playing = false; }
  }
  paint();
  if (S.playing) S.raf = requestAnimationFrame(frame);
}
function start() {
  if (S.pos >= D.T) S.pos = 0;
  S.playing = true;
  S.last = performance.now();
  if (!S.raf) S.raf = requestAnimationFrame(frame);
}
// Pausing does not depend on drawing: the state flips and the loop is cancelled first.
function stop() {
  S.playing = false;
  if (S.raf) { cancelAnimationFrame(S.raf); S.raf = 0; }
  paint();
}
function seek(x) {
  S.pos = clamp(x, 0, D.T);
  if (!S.playing) paint();
}

$("play").onclick = () => (S.playing ? stop() : start());
$("zin").onclick = () => setZoomStep(S.zoomStep + 1);
$("zout").onclick = () => setZoomStep(S.zoomStep - 1);
$("zfollow").onclick = () => { S.follow = !S.follow; syncZoomUi(); if (S.follow) { followHead(true); drawBase(); } paint(); };
// A mouse can pan a zoomed map (that turns following off); a finger cannot -- it keeps scrolling the page.
{
  const map = $("map");
  let drag = null;
  map.addEventListener("pointerdown", (e) => {
    if (e.pointerType !== "mouse" || S.zoomStep === 0) return;
    drag = { x: e.clientX, y: e.clientY };
    map.setPointerCapture(e.pointerId);
  });
  map.addEventListener("pointermove", (e) => {
    map.classList.toggle("pan", e.pointerType === "mouse" && S.zoomStep > 0);
    if (!drag) return;
    V.cx -= (e.clientX - drag.x) / worldPx(); V.cy -= (e.clientY - drag.y) / worldPx();
    drag = { x: e.clientX, y: e.clientY };
    if (S.follow) { S.follow = false; syncZoomUi(); }
    drawBase(); paint();
  });
  const end = () => { drag = null; };
  map.addEventListener("pointerup", end);
  map.addEventListener("pointercancel", end);
}
$("scrub").addEventListener("input", (e) => seek((Number(e.target.value) / 1000) * D.T));
function openChannel(name) {
  if (name === channelName || typeof BroadcastChannel === "undefined") return;
  if (channel) channel.close();
  channelName = name;
  channel = new BroadcastChannel(name);
  channel.onmessage = (e) => {
    const m = e.data || {};
    if (!D) return;
    if (m.type === "seek") seek(m.pos);
    else if (m.type === "hello") publish();
  };
}
document.addEventListener("keydown", (e) => {
  if (!D) return;
  if (e.key === " " && e.target === document.body) { e.preventDefault(); S.playing ? stop() : start(); }
  else if (e.key === "ArrowRight") seek(S.pos + Math.max(5, D.T / 50));
  else if (e.key === "ArrowLeft") seek(S.pos - Math.max(5, D.T / 50));
});

/* ------------------------------------------------------------ Streamlit */

function fit() { send("streamlit:setFrameHeight", { height: Math.ceil(document.getElementById("app").getBoundingClientRect().height) + 4 }); }
let token = null;
function render(args) {
  const fresh = JSON.stringify([args.data.t.length, args.data.km[args.data.km.length - 1], args.map_height]) !== token;
  A = args;
  openChannel(`garmin-replay-${args.channel}`);
  if (fresh) {                    // a different activity: start again
    token = JSON.stringify([args.data.t.length, args.data.km[args.data.km.length - 1], args.map_height]);
    S.pos = 0; S.playing = false;
    prepare();
  } else {
    buildStaticUi();
  }
  layout(); drawBase(); paint(); fit();
}
let timer;
window.addEventListener("resize", () => { clearTimeout(timer); timer = setTimeout(() => { if (A) { layout(); drawBase(); paint(); fit(); } }, 120); });
window.addEventListener("message", (event) => {
  const data = event.data || {};
  if (data.type === "streamlit:render" && data.args && data.args.data) render(data.args);
});
send("streamlit:componentReady", { apiVersion: 1 });
</script>
