<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Mapa aktywności</title>
<style>
  :root { --ink: #fafafa; --ink2: #d5d7dc; --muted: #9aa0aa; --faint: #6b707a; --edge: #24272d;
          --glass: rgba(10,11,13,.84); --hover: #1b1e23; --accent: #3987e5; }
  html, body { margin: 0; padding: 0; background: transparent; color: var(--ink); overflow: hidden;
               font: 14px/1.4 "Source Sans 3", "Source Sans Pro", -apple-system, system-ui, "Segoe UI", sans-serif;
               -webkit-tap-highlight-color: transparent; }
  #app { display: flex; flex-direction: column; gap: 10px; }
  #app.full { background: #000; padding: 10px; box-sizing: border-box; height: 100vh; }
  #mapwrap { position: relative; flex: none; border-radius: 12px; overflow: hidden; background: #000;
             border: 1px solid var(--edge); }
  /* One finger scrolls the page, two move the map (the touch handlers below); full screen has no page. */
  #map { display: block; width: 100%; touch-action: pan-x pan-y; cursor: grab; user-select: none; }
  #app.full #map { touch-action: none; }
  #map.near { cursor: pointer; } #map.drag { cursor: grabbing; }

  button { font: inherit; color: var(--ink2); background: var(--glass); border: 1px solid var(--edge);
           cursor: pointer; line-height: 1.3; padding: 0; }
  button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  button svg { display: block; width: 18px; height: 18px; margin: auto; fill: none; stroke: currentColor;
               stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  @media (hover: hover) { button:hover:not([aria-pressed="true"]):not(#play) { background: var(--hover); color: var(--ink); } }

  /* What the colour means: one joined switch, top left. */
  #chips { position: absolute; left: 8px; top: 8px; display: flex; border-radius: 999px; overflow: hidden;
           border: 1px solid var(--edge); background: var(--glass); }
  #chips button { border: 0; background: transparent; padding: 5px 12px; font-size: 13px; }
  #chips button[aria-pressed="true"] { background: var(--accent); color: #fff; font-weight: 600; }
  #tools { position: absolute; right: 8px; top: 8px; display: flex; flex-direction: column; gap: 6px; }
  #tools .pair { display: flex; flex-direction: column; border-radius: 10px; overflow: hidden; border: 1px solid var(--edge); }
  #tools button { width: 36px; height: 36px; }
  #tools .pair button { border: 0; }
  #tools .pair button + button { border-top: 1px solid var(--edge); }
  #tools > button { border-radius: 10px; }
  #tools button:disabled { color: var(--faint); cursor: default; background: var(--glass); }
  #legend { position: absolute; left: 8px; bottom: 8px; display: flex; align-items: center; gap: 6px;
            background: var(--glass); border-radius: 8px; padding: 4px 8px; font-size: 11.5px; color: var(--ink2);
            font-variant-numeric: tabular-nums; pointer-events: none; }
  #legend .sw { display: flex; } #legend .sw i { display: block; width: 13px; height: 8px; }
  #legend .u { color: var(--muted); }
  #attr { position: absolute; right: 6px; bottom: 4px; font-size: 10px; color: var(--muted); background: rgba(0,0,0,.5);
          padding: 0 4px; border-radius: 4px; }
  #attr a { color: inherit; }
  #hint { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); background: rgba(0,0,0,.82);
          border: 1px solid var(--edge); color: var(--ink); padding: 8px 14px; border-radius: 10px; font-size: 13px;
          white-space: nowrap; opacity: 0; transition: opacity .18s; pointer-events: none; }
  #hint.on { opacity: 1; }

  /* The numbers of the moment under the dot; at rest one line that says how to get them. */
  #stats { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(0, 1fr); gap: 0 14px; min-height: 42px;
           align-items: center; padding: 0 2px; }
  #rest { color: var(--muted); font-size: 13px; }
  #stats.rest .cell, #stats:not(.rest) #rest { display: none; }
  .cell { min-width: 0; }
  .cell .k { font-size: 10.5px; font-weight: 600; letter-spacing: .07em; text-transform: uppercase; color: var(--faint);
             white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .cell .v { font-size: 19px; font-weight: 650; color: var(--ink); font-variant-numeric: tabular-nums; white-space: nowrap; }
  .cell .v small { font-size: 12px; font-weight: 500; color: var(--muted); margin-left: 3px; }

  /* Play, the activity's profile as the seek bar, the speed. One row on every screen. */
  #bar { display: flex; align-items: center; gap: 10px; }
  #play { flex: none; width: 44px; height: 44px; border-radius: 50%; border: 0; background: var(--accent); color: #fff; }
  #play svg { width: 20px; height: 20px; fill: currentColor; stroke: none; }
  #stripwrap { flex: 1; min-width: 0; touch-action: pan-y; cursor: ew-resize; user-select: none; }
  #strip { display: block; width: 100%; height: 44px; }
  #speed { flex: none; min-width: 54px; height: 34px; padding: 0 10px; border-radius: 999px; font-weight: 600;
           font-variant-numeric: tabular-nums; }
  .hidden { display: none !important; }
  @media (max-width: 520px) {
    .cell:nth-child(n+6) { display: none; }       /* #rest is the first child: four cells stay */
    .cell .v { font-size: 17px; } #stats { gap: 0 8px; }
    #chips button { padding: 5px 10px; }
  }
  @media (prefers-reduced-motion: reduce) { #hint { transition: none; } }
</style>
</head>
<body>
<div id="app">
  <div id="mapwrap">
    <canvas id="map"></canvas>
    <div id="chips" role="group"></div>
    <div id="tools">
      <div class="pair">
        <button id="zin" type="button"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button>
        <button id="zout" type="button"><svg viewBox="0 0 24 24"><path d="M5 12h14"/></svg></button>
      </div>
      <button id="zfit" type="button"><svg viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/><circle cx="12" cy="12" r="1.5"/></svg></button>
      <button id="full" type="button"><svg viewBox="0 0 24 24"><path d="M14 4h6v6M20 4l-7 7M10 20H4v-6M4 20l7-7"/></svg></button>
    </div>
    <div id="legend"></div>
    <div id="attr">© <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">OpenStreetMap</a></div>
    <div id="hint" role="status"></div>
  </div>
  <div id="stats" class="rest"></div>
  <div id="bar">
    <button id="play" type="button"></button>
    <div id="stripwrap"><canvas id="strip"></canvas></div>
    <button id="speed" type="button"></button>
  </div>
</div>
<script>
"use strict";
/* One map for an activity: the track coloured by a measure, read by pointing at it, moved like any
   map, and played as a film from the same place. The Streamlit component protocol by hand, as in
   ../globe/ and ../herochart/. */
function send(type, data) { window.parent.postMessage({ isStreamlitMessage: true, type, ...data }, "*"); }
const $ = (id) => document.getElementById(id);

// OpenStreetMap standard tiles, as the globe's flat map (CARTO's rasters want a key now).
// The canvas filter turns them dark, so the track stays the loudest thing on the map.
const TILE_URL = "https://tile.openstreetmap.org/{z}/{x}/{y}.png";
const TILE_FILTER = {
  light: "saturate(0.35) brightness(1.04) contrast(0.92)",
  dark: "invert(1) hue-rotate(180deg) saturate(0.3) brightness(0.82) contrast(0.9)",
};
const FILTER_OK = "filter" in CanvasRenderingContext2D.prototype;
const PACE_WINDOW = 30;       // seconds the pace figure looks back
const TILE_CACHE = 400;
const MAX_ZOOM = 19;
const REACH = { mouse: 22, touch: 30 };   // px from the track that still count as pointing at it
const ICON = {
  play: '<svg viewBox="0 0 24 24"><path d="M8 5.5v13l11-6.5z"/></svg>',
  pause: '<svg viewBox="0 0 24 24"><path d="M7 5h3.5v14H7zM13.5 5H17v14h-3.5z"/></svg>',
  again: '<svg viewBox="0 0 24 24" style="fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round"><path d="M4 12a8 8 0 1 0 2.6-5.9M4 4v4.5h4.5"/></svg>',
};

let A = null;                 // the last render's args
let D = null;                 // the track, prepared
// pos: where the film is. peek: where the pointer is (a look, not a move) -- it wins while the film stands.
const S = { pos: 0, peek: null, playing: false, speed: 10, measure: "pace", last: 0, raf: 0, panned: false, full: false };
const V = { w: 0, h: 0, dpr: 1, zoom: 0, fit: 0, cx: 0, cy: 0, home: [0, 0] };   // map view
const tiles = new Map();
const base = document.createElement("canvas");
let ctx, bctx, sctx;
// The charts in the other column (../replaycharts/) share this clock: we publish it, they send seeks and peeks.
let channel = null, channelName = null;

/* ------------------------------------------------------------ helpers */

const clamp = (x, a, b) => Math.max(a, Math.min(b, x));
const pad2 = (n) => String(n).padStart(2, "0");
function fmtTime(s) {
  s = Math.max(0, Math.round(s));
  const h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60);
  return h ? `${h}:${pad2(m)}:${pad2(s % 60)}` : `${m}:${pad2(s % 60)}`;
}
function fmtPace(min) {            // 5.72 is 5:43, never "5.72"
  if (!(min > 0) || min > 60) return "—";
  const s = Math.round(min * 60);
  return `${Math.floor(s / 60)}:${pad2(s % 60)}`;
}
// Index i with t[i] <= x < t[i+1] (the last index at the end).
function find(x) {
  const t = D.t;
  let lo = 0, hi = t.length - 1;
  while (lo < hi - 1) { const mid = (lo + hi) >> 1; if (t[mid] <= x) lo = mid; else hi = mid; }
  return lo;
}
function lerpAt(arr, x, i) {
  const j = Math.min(i + 1, D.t.length - 1);
  const span = D.t[j] - D.t[i];
  const f = span > 0 ? clamp((x - D.t[i]) / span, 0, 1) : 0;
  return arr[i] + (arr[j] - arr[i]) * f;
}
function quantile(values, q) {
  const v = values.filter((x) => Number.isFinite(x)).sort((a, b) => a - b);
  if (!v.length) return 0;
  return v[Math.min(v.length - 1, Math.max(0, Math.round(q * (v.length - 1))))];
}
const shown = () => (S.peek != null && !S.playing ? S.peek : S.pos);
const atRest = () => !S.playing && S.peek == null && S.pos <= 0;
const zoomed = () => V.zoom > V.fit + 0.01;

/* ------------------------------------------------------------ prepare */

function prepare() {
  const d = A.data;
  D = { t: d.t, km: d.km, lat: d.lat, lon: d.lon, hr: d.hr, ele: d.ele, pace: d.pace, cad: d.cad,
        playable: d.playable !== false };
  D.T = d.t[d.t.length - 1];
  // Spherical Mercator, world = 1.
  D.ux = d.lon.map((lon) => (lon + 180) / 360);
  D.uy = d.lat.map((lat) => {
    const r = (lat * Math.PI) / 180;
    return (1 - Math.log(Math.tan(r) + 1 / Math.cos(r)) / Math.PI) / 2;
  });
  D.box = [Math.min(...D.ux), Math.max(...D.ux), Math.min(...D.uy), Math.max(...D.uy)];
  // Climb so far: positive changes of a smoothed profile, so GPS jitter does not count as hills.
  if (D.ele) {
    const sm = D.ele.map((_, i) => {
      let s = 0, n = 0;
      for (let k = Math.max(0, i - 2); k <= Math.min(D.ele.length - 1, i + 2); k++) { s += D.ele[k]; n++; }
      return s / n;
    });
    D.gain = [0];
    for (let i = 1; i < sm.length; i++) D.gain.push(D.gain[i - 1] + Math.max(0, sm[i] - sm[i - 1]));
  }
  // Kilometre marks: whole kilometres, thinned so a marathon does not wear forty of them.
  const total = D.km[D.km.length - 1];
  const step = [1, 2, 5, 10, 20, 50, 100].find((s) => total / s <= 12) || 200;
  D.marks = [];
  for (let k = step, i = 0; k < total - 0.15 * step; k += step) {
    while (i < D.km.length - 2 && D.km[i + 1] < k) i++;
    const span = D.km[i + 1] - D.km[i];
    const f = span > 0 ? clamp((k - D.km[i]) / span, 0, 1) : 0;
    D.marks.push({ km: k, ux: D.ux[i] + (D.ux[i + 1] - D.ux[i]) * f, uy: D.uy[i] + (D.uy[i + 1] - D.uy[i]) * f });
  }
  // The measures the track can colour by; pace runs backwards (fast = the light end on dark).
  D.measures = [];
  if (D.pace) D.measures.push({ key: "pace", label: A.text.m_pace, unit: "/km", series: D.pace, reverse: true });
  if (D.hr) D.measures.push({ key: "hr", label: A.text.m_hr, unit: "bpm", series: D.hr, reverse: false });
  if (D.ele) D.measures.push({ key: "ele", label: A.text.m_ele, unit: "m", series: D.ele, reverse: false });
  if (!D.measures.some((m) => m.key === S.measure)) S.measure = D.measures.length ? D.measures[0].key : null;
  for (const m of D.measures) {
    m.lo = quantile(m.series, 0.05);
    m.hi = quantile(m.series, 0.95);
    if (!(m.hi > m.lo)) { m.lo = Math.min(...m.series); m.hi = Math.max(...m.series); }
    // Smoothed copy for the seek bar.
    const w = Math.max(1, Math.round(m.series.length / 60));
    m.smooth = m.series.map((_, i) => {
      let s = 0, n = 0;
      for (let k = Math.max(0, i - w); k <= Math.min(m.series.length - 1, i + w); k++) { s += m.series[k]; n++; }
      return s / n;
    });
    m.slo = Math.min(...m.smooth); m.shi = Math.max(...m.smooth);
  }
  buildStaticUi();
}

function measure() { return D.measures.find((m) => m.key === S.measure) || null; }
function binOf(m, value) {
  const steps = A.theme.ramp.length;
  const share = (value - m.lo) / (m.hi - m.lo || 1);
  const idx = clamp(Math.floor(share * steps), 0, steps - 1);
  return A.theme.ramp[m.reverse ? steps - 1 - idx : idx];      // pace: low value = fast = the light end
}
const formatValue = (m, v) => (m.key === "pace" ? fmtPace(v) : Math.round(v).toString());

/* ------------------------------------------------------------ static UI */

function buildStaticUi() {
  const T = A.text;
  // The colour switch lives inside the map: changing it must not restart a Streamlit run.
  const chips = $("chips");
  chips.innerHTML = "";
  chips.setAttribute("aria-label", T.colour);
  chips.classList.toggle("hidden", D.measures.length < 2);
  for (const m of D.measures) {
    const b = document.createElement("button");
    b.type = "button"; b.textContent = m.label; b.dataset.key = m.key;
    b.onclick = () => { S.measure = m.key; syncUi(); paint(); };
    chips.appendChild(b);
  }
  if (!A.speeds.includes(S.speed)) S.speed = A.speeds[0];
  // The cells that exist for this track. On a phone the first four stay (CSS).
  const cells = [["distance", "dist"]];
  if (D.playable) cells.push(["time", "time"]);
  if (D.playable || D.pace) cells.push(["pace", "pace"]);
  if (D.hr) cells.push(["hr", "hr"]);
  if (D.ele) cells.push(["elevation", "ele"], ["climb", "gain"]);
  if (D.cad) cells.push(["cadence", "cad"]);
  const st = $("stats");
  st.innerHTML = '<div id="rest"></div>';
  const touch = window.matchMedia("(hover: none)").matches;
  $("rest").textContent = D.playable ? (touch ? T.rest_touch : T.rest_mouse) : (touch ? T.rest_touch_still : T.rest_mouse_still);
  for (const [label, id] of cells) {
    const c = document.createElement("div");
    c.className = "cell";
    c.innerHTML = `<div class="k"></div><div class="v" id="v_${id}"></div>`;
    c.firstChild.textContent = T[label];
    st.appendChild(c);
  }
  for (const [id, label] of [["zin", T.zoom_in], ["zout", T.zoom_out], ["zfit", T.fit], ["full", T.full],
                             ["stripwrap", T.seek]]) {
    $(id).setAttribute("aria-label", label); $(id).title = label;
  }
  $("play").classList.toggle("hidden", !D.playable);
  $("speed").classList.toggle("hidden", !D.playable);
  $("full").classList.toggle("hidden", !document.fullscreenEnabled);
  syncUi();
}

function syncUi() {
  for (const b of $("chips").children) b.setAttribute("aria-pressed", String(b.dataset.key === S.measure));
  $("speed").textContent = `×${S.speed}`;
  $("speed").title = `${A.text.speed}: ${S.speed} ${A.text.speed_hint}`;
  $("speed").setAttribute("aria-label", $("speed").title);
  $("zin").disabled = V.zoom >= MAX_ZOOM;
  $("zout").disabled = !zoomed();
  $("zfit").classList.toggle("hidden", !zoomed());
  const m = measure();
  const lg = $("legend");
  lg.classList.toggle("hidden", !m);
  if (!m) return;
  // The ramp always reads dark -> light; pace is the one that flips what the ends mean
  // (the light end is fast), so its labels run slow -> fast.
  const left = m.reverse ? m.hi : m.lo, right = m.reverse ? m.lo : m.hi;
  lg.innerHTML = `<span>${formatValue(m, left)}</span><span class="sw">${A.theme.ramp.map((c) => `<i style="background:${c}"></i>`).join("")}</span><span>${formatValue(m, right)}</span><span class="u">${m.unit}</span>`;
}

function setPlayIcon() {
  const T = A.text;
  const state = S.playing ? "pause" : S.pos >= D.T ? "again" : "play";
  const button = $("play");
  // Only when it changes: rewriting the button sixty times a second is churn under a pressed button.
  if (button.dataset.state === state) return;
  button.dataset.state = state;
  button.innerHTML = ICON[state];
  button.setAttribute("aria-label", T[state]); button.title = T[state];
}

let hintTimer = 0;
function hint(text) {
  const el = $("hint");
  el.textContent = text;
  el.classList.add("on");
  clearTimeout(hintTimer);
  hintTimer = setTimeout(() => el.classList.remove("on"), 1600);
}

/* ------------------------------------------------------------ view */

const worldPx = () => 256 * 2 ** V.zoom;
const sxOf = (ux) => V.w / 2 + (ux - V.cx) * worldPx();
const syOf = (uy) => V.h / 2 + (uy - V.cy) * worldPx();

function layout() {
  const wrap = $("mapwrap");
  const w = Math.max(220, Math.floor(wrap.clientWidth || document.body.clientWidth));
  // Full screen: whatever the numbers and the bar leave of the window.
  const rest = $("stats").offsetHeight + $("bar").offsetHeight + 20 + 20 + 2;
  const h = S.full ? Math.max(220, window.innerHeight - rest) : Math.max(220, A.map_height | 0);
  V.w = w; V.h = h; V.dpr = window.devicePixelRatio || 1;
  for (const c of [$("map"), base]) { c.width = Math.round(w * V.dpr); c.height = Math.round(h * V.dpr); }
  $("map").style.height = `${h}px`;
  ctx = $("map").getContext("2d");
  bctx = base.getContext("2d");
  const strip = $("strip");
  strip.width = Math.round(strip.clientWidth * V.dpr); strip.height = Math.round(strip.clientHeight * V.dpr);
  sctx = strip.getContext("2d");
  // The whole route in the box with a margin, centred: zoom never goes further out than this.
  const pad = 40;
  const [minx, maxx, miny, maxy] = D.box;
  const fitPx = Math.min((w - 2 * pad) / Math.max(maxx - minx, 1e-7), (h - 2 * pad) / Math.max(maxy - miny, 1e-7));
  const was = zoomed();
  V.fit = clamp(Math.log2(fitPx / 256), 1, 18);
  V.home = [(minx + maxx) / 2, (miny + maxy) / 2];
  if (!was) goHome(); else V.zoom = clamp(V.zoom, V.fit, MAX_ZOOM);
}

function goHome() { V.zoom = V.fit; [V.cx, V.cy] = V.home; S.panned = false; }
function redraw() { syncUi(); drawBase(); paint(); }
// After any change of the view: back at the whole route means home; otherwise the centre stays on the route.
function settle() {
  if (!zoomed()) goHome();
  else { V.cx = clamp(V.cx, D.box[0], D.box[1]); V.cy = clamp(V.cy, D.box[2], D.box[3]); }
  redraw();
}
// Zoom by dz levels keeping the point under (px, py) where it is.
function zoomAt(dz, px, py) {
  const z = clamp(V.zoom + dz, V.fit, MAX_ZOOM);
  if (z === V.zoom) return;
  const wx = V.cx + (px - V.w / 2) / worldPx(), wy = V.cy + (py - V.h / 2) / worldPx();
  V.zoom = z;
  V.cx = wx - (px - V.w / 2) / worldPx(); V.cy = wy - (py - V.h / 2) / worldPx();
  settle();
}
function panBy(dx, dy) {
  if (!zoomed()) return false;
  V.cx -= dx / worldPx(); V.cy -= dy / worldPx();
  S.panned = true;               // the hand has the camera now, not the dot
  settle();
  return true;
}
function headAt() {
  const x = shown(), i = find(x);
  return [lerpAt(D.ux, x, i), lerpAt(D.uy, x, i)];
}
// The buttons zoom toward the dot when there is one on screen, else toward the middle.
function zoomButton(dz) {
  let px = V.w / 2, py = V.h / 2;
  if (!atRest()) {
    const [hx, hy] = headAt();
    const x = sxOf(hx), y = syOf(hy);
    if (x >= 0 && x <= V.w && y >= 0 && y <= V.h) { px = x; py = y; }
  }
  zoomAt(dz, px, py);
}
// While the film runs zoomed in, the camera goes after the dot -- until a hand moves the map.
function follow() {
  if (!S.playing || !zoomed() || S.panned) return false;
  const [hx, hy] = headAt();
  const nx = V.cx + (hx - V.cx) * 0.2, ny = V.cy + (hy - V.cy) * 0.2;
  if (Math.abs(nx - V.cx) * worldPx() < 0.3 && Math.abs(ny - V.cy) * worldPx() < 0.3) return false;
  V.cx = nx; V.cy = ny;
  return true;
}
// A seek from elsewhere (the bar, the charts) must not leave the dot off the map.
function reveal() {
  if (!zoomed()) return false;
  const [hx, hy] = headAt();
  const x = sxOf(hx), y = syOf(hy), m = 28;
  if (x >= m && x <= V.w - m && y >= m && y <= V.h - m) return false;
  V.cx = hx; V.cy = hy;
  return true;
}
// The sample nearest to a point of the canvas, and how far it is in px.
function nearest(px, py) {
  let best = -1, bd = Infinity;
  for (let i = 0; i < D.ux.length; i++) {
    const dx = sxOf(D.ux[i]) - px, dy = syOf(D.uy[i]) - py, d = dx * dx + dy * dy;
    if (d < bd) { bd = d; best = i; }
  }
  return { i: best, d: Math.sqrt(bd) };
}

/* ------------------------------------------------------------ drawing */

function requestTile(z, x, y) {
  const key = `${z}/${x}/${y}`;
  let e = tiles.get(key);
  if (e) return e;
  const img = new Image();
  img.crossOrigin = "anonymous";
  e = { img, ok: false, cv: null };
  img.onload = () => {
    // The theme filter is paid once per tile, not once per frame: a camera that follows the runner
    // redraws the base every frame, and a filter on a dozen tiles each time is what a phone cannot do.
    const cv = document.createElement("canvas");
    cv.width = img.naturalWidth || 256; cv.height = img.naturalHeight || 256;
    const c = cv.getContext("2d");
    if (FILTER_OK) c.filter = TILE_FILTER[A && A.theme.dark ? "dark" : "light"];
    c.drawImage(img, 0, 0);
    e.cv = cv; e.ok = true; schedule();
  };
  img.src = TILE_URL.replace("{z}", z).replace("{x}", x).replace("{y}", y);
  tiles.set(key, e);
  while (tiles.size > TILE_CACHE) tiles.delete(tiles.keys().next().value);
  return e;
}

let pendingBase = 0;
function schedule() {            // tiles arrive one by one: repaint the base once per frame at most
  if (pendingBase) return;
  pendingBase = requestAnimationFrame(() => { pendingBase = 0; drawBase(); paint(); });
}

function drawBase() {
  if (!bctx) return;
  const { w, h, dpr } = V;
  bctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  bctx.clearRect(0, 0, w, h);
  bctx.fillStyle = A.theme.surface;
  bctx.fillRect(0, 0, w, h);
  // Tiles: one level finer on a retina screen (OSM tiles are 256 px only).
  const zt = clamp(Math.round(V.zoom) + (dpr > 1 ? 1 : 0), 0, 19);
  const n = 2 ** zt, size = worldPx() / n;
  const x0 = Math.floor((V.cx - w / 2 / worldPx()) * n), x1 = Math.floor((V.cx + w / 2 / worldPx()) * n);
  const y0 = Math.max(0, Math.floor((V.cy - h / 2 / worldPx()) * n)), y1 = Math.min(n - 1, Math.floor((V.cy + h / 2 / worldPx()) * n));
  for (let ty = y0; ty <= y1; ty++) {
    for (let tx = x0; tx <= x1; tx++) {
      const wx = ((tx % n) + n) % n;
      const px = sxOf(tx / n), py = syOf(ty / n);
      const e = requestTile(zt, wx, ty);
      if (e.ok) { bctx.drawImage(e.cv, px, py, size + 0.5, size + 0.5); continue; }
      for (let dz = 1; dz <= Math.min(6, zt); dz++) {      // stand in with a coarser tile while it loads
        const p = tiles.get(`${zt - dz}/${wx >> dz}/${ty >> dz}`);
        if (!p || !p.ok) continue;
        const part = p.cv.width / 2 ** dz;
        bctx.drawImage(p.cv, (wx - ((wx >> dz) << dz)) * part, (ty - ((ty >> dz) << dz)) * part, part, part, px, py, size + 0.5, size + 0.5);
        break;
      }
    }
  }
  if (!FILTER_OK && A.theme.dark) { bctx.fillStyle = "rgba(0,0,0,.6)"; bctx.fillRect(0, 0, w, h); }
  // The whole route, quiet: the shape under the colour, and where the dot is going.
  bctx.lineCap = "round"; bctx.lineJoin = "round";
  bctx.strokeStyle = A.theme.dark ? "rgba(255,255,255,.22)" : "rgba(0,0,0,.2)";
  bctx.lineWidth = 7;
  bctx.beginPath();
  D.ux.forEach((u, i) => { const x = sxOf(u), y = syOf(D.uy[i]); i ? bctx.lineTo(x, y) : bctx.moveTo(x, y); });
  bctx.stroke();
}

function drawMap() {
  const { dpr } = V;
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.drawImage(base, 0, 0);
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.lineCap = "round"; ctx.lineJoin = "round"; ctx.lineWidth = 4.5;
  const m = measure();
  const x = shown(), i = find(x), last = D.ux.length - 1;
  const hx = lerpAt(D.ux, x, i), hy = lerpAt(D.uy, x, i);
  // Standing still or being pointed at, the whole track wears the colour; a film (or a place
  // it was moved to) colours only what is behind the dot.
  const whole = atRest() || (S.peek != null && !S.playing);
  const upTo = whole ? last : i;
  const colourOf = (k) => (m ? binOf(m, (m.series[k] + m.series[Math.min(k + 1, last)]) / 2) : A.theme.series);
  // One path per shade, not one per segment.
  const paths = new Map();
  for (let k = 0; k < upTo; k++) {
    const c = colourOf(k);
    let p = paths.get(c);
    if (!p) { p = new Path2D(); paths.set(c, p); }
    p.moveTo(sxOf(D.ux[k]), syOf(D.uy[k]));
    p.lineTo(sxOf(D.ux[k + 1]), syOf(D.uy[k + 1]));
  }
  if (!whole) {
    const c = colourOf(i);
    let p = paths.get(c);
    if (!p) { p = new Path2D(); paths.set(c, p); }
    p.moveTo(sxOf(D.ux[i]), syOf(D.uy[i]));
    p.lineTo(sxOf(hx), syOf(hy));
  }
  for (const [c, p] of paths) { ctx.strokeStyle = c; ctx.stroke(p); }
  // Kilometre marks.
  ctx.font = '600 10px "Source Sans 3", "Source Sans Pro", system-ui, sans-serif';
  ctx.textAlign = "center"; ctx.textBaseline = "middle";
  for (const k of D.marks) {
    const px = sxOf(k.ux), py = syOf(k.uy);
    if (px < -10 || py < -10 || px > V.w + 10 || py > V.h + 10) continue;
    ctx.fillStyle = "rgba(0,0,0,.78)"; ctx.strokeStyle = "rgba(255,255,255,.55)"; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.arc(px, py, 8.5, 0, 7); ctx.fill(); ctx.stroke();
    ctx.fillStyle = "#fff";
    ctx.fillText(String(k.km), px, py + 0.5);
  }
  // Start: a light dot. Finish: a dark one with a light ring.
  ctx.lineWidth = 2.5;
  ctx.fillStyle = "#000"; ctx.strokeStyle = "#fff";
  ctx.beginPath(); ctx.arc(sxOf(D.ux[last]), syOf(D.uy[last]), 5, 0, 7); ctx.fill(); ctx.stroke();
  ctx.fillStyle = "#fff"; ctx.strokeStyle = "#000";
  ctx.beginPath(); ctx.arc(sxOf(D.ux[0]), syOf(D.uy[0]), 5, 0, 7); ctx.fill(); ctx.stroke();
  // The dot: only when it stands for a moment someone asked about.
  if (!atRest()) {
    ctx.fillStyle = "#fff"; ctx.strokeStyle = A.theme.accent; ctx.lineWidth = 3.5;
    ctx.beginPath(); ctx.arc(sxOf(hx), syOf(hy), 7.5, 0, 7); ctx.fill(); ctx.stroke();
  }
}

// The seek bar is the activity's profile in the chosen measure: where it was hard is where to look.
function drawStrip() {
  const canvas = $("strip");
  const w = canvas.clientWidth, h = canvas.clientHeight, dpr = V.dpr;
  if (!w || !sctx) return;
  sctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  sctx.clearRect(0, 0, w, h);
  const m = measure();
  const px = (shown() / D.T) * w, bottom = h - 4, top = 4;
  const xOf = (t) => (t / D.T) * w;
  if (m) {
    const span = m.shi - m.slo || 1;
    // Up is more of the measure; for pace up is faster, as on every pace axis here.
    const yOf = (v) => top + (bottom - top - 6) * (m.reverse ? (v - m.slo) / span : 1 - (v - m.slo) / span);
    const area = new Path2D();
    area.moveTo(0, bottom);
    D.t.forEach((t, k) => area.lineTo(xOf(t), yOf(m.smooth[k])));
    area.lineTo(w, bottom); area.closePath();
    const rest = atRest();
    for (const [x0, x1, fill] of [[0, rest ? w : px, A.theme.accent + (rest ? "66" : "aa")], [rest ? w : px, w, "rgba(154,160,170,.28)"]]) {
      if (x1 <= x0) continue;
      sctx.save(); sctx.beginPath(); sctx.rect(x0, 0, x1 - x0, h); sctx.clip();
      sctx.fillStyle = fill; sctx.fill(area);
      sctx.restore();
    }
  } else {
    sctx.fillStyle = "rgba(154,160,170,.28)"; sctx.fillRect(0, h / 2 - 2, w, 4);
    sctx.fillStyle = A.theme.accent; sctx.fillRect(0, h / 2 - 2, px, 4);
  }
  sctx.fillStyle = A.theme.grid; sctx.fillRect(0, bottom, w, 1);
  // The playhead: a line with a handle, so it reads as something to grab.
  const hxp = clamp(px, 5, w - 5);
  sctx.fillStyle = "#fff";
  sctx.fillRect(hxp - 1, 0, 2, h);
  sctx.beginPath(); sctx.arc(hxp, bottom, 5, 0, 7); sctx.fill();
}

function updateStats() {
  $("stats").classList.toggle("rest", atRest());
  if (atRest()) return;
  const x = shown(), i = find(x);
  const set = (id, text, unit) => {
    const el = $(`v_${id}`);
    if (!el) return;
    el.textContent = text;
    if (unit) { const s = document.createElement("small"); s.textContent = unit; el.appendChild(s); }
  };
  const km = lerpAt(D.km, x, i);
  set("dist", km.toFixed(2), "km");
  set("time", fmtTime(x));
  if (D.playable) {
    // Pace of the last half minute: a stop at the lights reads "—", not a pace of 40 min/km.
    const back = Math.max(0, x - PACE_WINDOW);
    const dk = km - lerpAt(D.km, back, find(back)), dt = x - back;
    set("pace", dt >= 5 && dk * 1000 > dt * 0.4 ? fmtPace(dt / 60 / dk) : "—", "/km");
  } else if (D.pace) set("pace", fmtPace(lerpAt(D.pace, x, i)), "/km");
  if (D.hr) set("hr", String(Math.round(lerpAt(D.hr, x, i))), "bpm");
  if (D.ele) {
    set("ele", String(Math.round(lerpAt(D.ele, x, i))), "m");
    set("gain", `+${Math.round(lerpAt(D.gain, x, i))}`, "m");
  }
  if (D.cad) set("cad", String(Math.round(lerpAt(D.cad, x, i))), "spm");
}

// What the charts beside the map need to know: where the dot is and whether the film runs.
function publish() {
  if (channel) channel.postMessage({ type: "pos", pos: shown(), playing: S.playing, rest: atRest(),
                                     whole: atRest() || (S.peek != null && !S.playing), T: D.T });
}

function paint() {
  if (!D || !ctx) return;
  // The state button comes first and a failing drawing must not take the controls with it.
  setPlayIcon();
  try {
    if (follow()) drawBase();        // the camera runs after the dot: the map moves under it
    drawMap();
    drawStrip();
    updateStats();
  } catch (error) {
    console.error("map paint failed:", error);
  }
  publish();
}

/* ------------------------------------------------------------ the clock */

function frame(now) {
  S.raf = 0;
  if (S.playing) {
    S.pos += (Math.max(0, now - S.last) / 1000) * S.speed;
    S.last = now;
    if (S.pos >= D.T) { S.pos = D.T; S.playing = false; }
  }
  paint();
  if (S.playing) S.raf = requestAnimationFrame(frame);
}
function start() {
  if (!D.playable) return;
  if (S.pos >= D.T) S.pos = 0;
  S.peek = null;
  S.playing = true;
  S.panned = false;                 // pressing play hands the camera back to the dot
  S.last = performance.now();
  if (reveal()) drawBase();
  if (!S.raf) S.raf = requestAnimationFrame(frame);
}
// Pausing does not depend on drawing: the state flips and the loop is cancelled first.
function stop() {
  S.playing = false;
  if (S.raf) { cancelAnimationFrame(S.raf); S.raf = 0; }
  paint();
}
// Move the film (a press, a drag, a tap on the track).
function seek(x) {
  S.pos = clamp(x, 0, D.T);
  S.peek = null;
  if (reveal()) drawBase();
  if (!S.playing) paint();
}
// Look at a moment without moving the film (a mouse over the track or over a chart).
function peek(x) {
  if (S.playing) x = null;
  if (x != null) x = clamp(x, 0, D.T);
  if (x === S.peek) return;
  S.peek = x;
  if (x != null && reveal()) drawBase();
  paint();
}

/* ------------------------------------------------------------ input */

$("play").onclick = () => (S.playing ? stop() : start());
$("speed").onclick = () => { S.speed = A.speeds[(A.speeds.indexOf(S.speed) + 1) % A.speeds.length]; syncUi(); };
$("zin").onclick = () => zoomButton(1);
$("zout").onclick = () => zoomButton(-1);
$("zfit").onclick = () => { goHome(); redraw(); };
$("full").onclick = () => {
  if (document.fullscreenElement) document.exitFullscreen();
  else $("app").requestFullscreen().catch(() => {});
};
document.addEventListener("fullscreenchange", () => {
  S.full = !!document.fullscreenElement;
  $("app").classList.toggle("full", S.full);
  if (!S.full) goHome();
  layout(); redraw(); fit();
});

{
  const map = $("map");
  const at = (e) => { const r = map.getBoundingClientRect(); return [e.clientX - r.left, e.clientY - r.top]; };

  /* A mouse: moving over the track reads it, a click moves the film there, a drag moves the map,
     a double click zooms in. The wheel belongs to the page unless Ctrl/⌘ is held (a trackpad pinch
     arrives that way), so scrolling past the map never changes it. */
  let drag = null;
  map.addEventListener("pointerdown", (e) => {
    if (e.pointerType !== "mouse" || e.button !== 0) return;
    drag = { x: e.clientX, y: e.clientY, moved: false };
    map.setPointerCapture(e.pointerId);
  });
  map.addEventListener("pointermove", (e) => {
    if (e.pointerType !== "mouse") return;
    if (drag) {
      const dx = e.clientX - drag.x, dy = e.clientY - drag.y;
      if (!drag.moved && Math.hypot(dx, dy) < 4) return;
      drag.moved = true; drag.x = e.clientX; drag.y = e.clientY;
      map.classList.add("drag");
      panBy(dx, dy);
      return;
    }
    const [px, py] = at(e);
    const hit = nearest(px, py);
    const on = hit.d <= REACH.mouse;
    map.classList.toggle("near", on);
    peek(on ? D.t[hit.i] : null);
  });
  const release = (e) => {
    if (e.pointerType !== "mouse" || !drag) return;
    const moved = drag.moved;
    drag = null;
    map.classList.remove("drag");
    if (moved || e.type !== "pointerup") return;
    const [px, py] = at(e);
    const hit = nearest(px, py);
    if (hit.d <= REACH.mouse) seek(D.t[hit.i]);
  };
  map.addEventListener("pointerup", release);
  map.addEventListener("pointercancel", release);
  map.addEventListener("pointerleave", (e) => { if (e.pointerType === "mouse" && !drag) { map.classList.remove("near"); peek(null); } });
  map.addEventListener("dblclick", (e) => { const [px, py] = at(e); zoomAt(1, px, py); });
  map.addEventListener("wheel", (e) => {
    if (e.ctrlKey || e.metaKey) { e.preventDefault(); zoomAt(-e.deltaY * (e.deltaMode ? 0.12 : 0.012), ...at(e)); }
    else if (D) hint(/Mac|iPhone|iPad/.test(navigator.platform) ? A.text.wheel_mac : A.text.wheel);
  }, { passive: false });

  /* Fingers: one scrolls the page (and a tap on the track moves the film there), two move and
     pinch the map. Only the two-finger gesture is taken from the page. In full screen there is no
     page to scroll, so one finger moves the map. */
  let touch = null;
  const point = (t) => { const r = map.getBoundingClientRect(); return [t.clientX - r.left, t.clientY - r.top]; };
  const pair = (ts) => {
    const [ax, ay] = point(ts[0]), [bx, by] = point(ts[1]);
    return { d: Math.max(1, Math.hypot(ax - bx, ay - by)), x: (ax + bx) / 2, y: (ay + by) / 2 };
  };
  map.addEventListener("touchstart", (e) => {
    if (e.touches.length === 1) {
      const [x, y] = point(e.touches[0]);
      touch = { mode: "one", x, y, sx: x, sy: y, moved: false };
    } else if (e.touches.length === 2) {
      if (e.cancelable) e.preventDefault();
      touch = { mode: "two", ...pair(e.touches) };
    }
  }, { passive: false });
  map.addEventListener("touchmove", (e) => {
    if (!touch) return;
    if (touch.mode === "two" && e.touches.length >= 2) {
      if (e.cancelable) e.preventDefault();
      const now = pair(e.touches);
      zoomAt(Math.log2(now.d / touch.d), now.x, now.y);
      panBy(now.x - touch.x, now.y - touch.y);
      touch = { mode: "two", ...now };
    } else if (touch.mode === "one" && e.touches.length === 1) {
      const [x, y] = point(e.touches[0]);
      if (Math.hypot(x - touch.sx, y - touch.sy) > 10) touch.moved = true;
      if (S.full) {
        if (e.cancelable) e.preventDefault();
        panBy(x - touch.x, y - touch.y);
      } else if (Math.abs(x - touch.sx) > 30 && Math.abs(x - touch.sx) > Math.abs(y - touch.sy)) {
        hint(A.text.two_fingers);        // a sideways drag wanted the map: say how
      }
      touch.x = x; touch.y = y;
    }
  }, { passive: false });
  map.addEventListener("touchend", (e) => {
    if (!touch) return;
    if (e.touches.length === 0) {
      if (touch.mode === "one" && !touch.moved) {
        const hit = nearest(touch.x, touch.y);
        if (hit.d <= REACH.touch) seek(D.t[hit.i]);
      }
      touch = null;
    } else if (e.touches.length === 1) {
      // The finger left from a pinch neither taps nor drags on.
      const [x, y] = point(e.touches[0]);
      touch = { mode: "one", x, y, sx: x, sy: y, moved: true };
    }
  });
  map.addEventListener("touchcancel", () => { touch = null; });
}

/* The seek bar: a press or a drag moves the film (finger and mouse alike, the page keeps its
   vertical scroll); a mouse passing over it only looks. */
{
  const wrap = $("stripwrap");
  let dragging = false;
  const at = (e) => { const r = wrap.getBoundingClientRect(); return clamp((e.clientX - r.left) / r.width, 0, 1) * D.T; };
  wrap.addEventListener("pointerdown", (e) => { if (!D) return; dragging = true; wrap.setPointerCapture(e.pointerId); seek(at(e)); });
  wrap.addEventListener("pointermove", (e) => {
    if (dragging) seek(at(e));
    else if (e.pointerType === "mouse" && D) peek(at(e));
  });
  const release = () => { dragging = false; };
  wrap.addEventListener("pointerup", release);
  wrap.addEventListener("pointercancel", release);
  wrap.addEventListener("pointerleave", (e) => { if (e.pointerType === "mouse" && !dragging) peek(null); });
}

function openChannel(name) {
  if (name === channelName || typeof BroadcastChannel === "undefined") return;
  if (channel) channel.close();
  channelName = name;
  channel = new BroadcastChannel(name);
  channel.onmessage = (e) => {
    const m = e.data || {};
    if (!D) return;
    if (m.type === "seek") seek(m.pos);
    else if (m.type === "peek") peek(m.pos);
    else if (m.type === "hello") publish();
  };
}
document.addEventListener("keydown", (e) => {
  if (!D) return;
  if (e.key === " " && (e.target === document.body || e.target === $("app"))) { e.preventDefault(); S.playing ? stop() : start(); }
  else if (e.key === "ArrowRight") seek(S.pos + Math.max(5, D.T / 50));
  else if (e.key === "ArrowLeft") seek(S.pos - Math.max(5, D.T / 50));
  else if (e.key === "+" || e.key === "=") zoomButton(1);
  else if (e.key === "-") zoomButton(-1);
});

/* ------------------------------------------------------------ Streamlit */

function fit() {
  if (S.full) return;
  send("streamlit:setFrameHeight", { height: Math.ceil($("app").getBoundingClientRect().height) + 4 });
}
let token = null;
function render(args) {
  const next = JSON.stringify([args.data.t.length, args.data.km[args.data.km.length - 1], args.data.lat[0], args.channel]);
  A = args;
  openChannel(`garmin-replay-${args.channel}`);
  if (next !== token) {            // a different activity: start again, whole route in view
    token = next;
    S.pos = 0; S.peek = null; S.playing = false;
    if (S.raf) { cancelAnimationFrame(S.raf); S.raf = 0; }
    V.zoom = -1;
    prepare();
  } else {
    buildStaticUi();               // the same activity, maybe another language
  }
  layout(); redraw(); fit();
}
let timer;
window.addEventListener("resize", () => { clearTimeout(timer); timer = setTimeout(() => { if (A) { layout(); redraw(); fit(); } }, 120); });
window.addEventListener("message", (event) => {
  const data = event.data || {};
  if (data.type === "streamlit:render" && data.args && data.args.data) render(data.args);
});
send("streamlit:componentReady", { apiVersion: 1 });
</script>
</body>
</html>
